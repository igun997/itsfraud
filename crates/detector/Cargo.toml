[package]
name = "detector"
version = "0.1.0"
edition = "2021"

[features]
# PDF rendering needs the pdfium shared library at runtime (https://github.com/bblanchon/pdfium-binaries)
pdf = ["dep:pdfium-render"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
ndarray = "0.17.2"
ort = "2.0.0-rc.15"
# pdfium API level pinned to 7881 so it works with pdfium builds 7881 and newer (e.g. the library bundled in pypdfium2 5.x, build 8076)
pdfium-render = { version = "0.9.5", optional = true, default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
