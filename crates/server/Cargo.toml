[package]
name = "server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "itsfraud"
path = "src/main.rs"

[features]
# PDF input: needs the pdfium shared library at runtime (libpdfium.so on the library path)
pdf = ["detector/pdf"]

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
detector = { version = "0.1.0", path = "../detector" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
